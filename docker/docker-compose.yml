version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taydau
      POSTGRES_PASSWORD: taydau
      POSTGRES_DB: taydau
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taydau"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
